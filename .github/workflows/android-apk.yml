# =====================================================================
#  AllGenURecomp -> APK de Android (arm64), compilado GRATIS en GitHub.
#
#  Caso "sin PC":
#    - Este repo (publico) = el codigo. Actions es gratis e ilimitado.
#    - Tu dump del juego vive en OTRO repo PRIVADO. Aqui se lee con un token.
#    - El APK sale como artifact descargable desde el navegador del telefono.
#
#  Secrets a configurar UNA vez (Settings -> Secrets and variables -> Actions):
#    DUMP_REPO     usuario/repo-privado        (ej: pepe/allgenu-dump)
#    DUMP_TOKEN    token de solo lectura de ese repo (Contents: Read-only)
#    KEYSTORE_B64  (opcional) keystore en base64, para firmar siempre igual
#    KS_PASS       (opcional) clave del keystore
#
#  Uso: pestaña Actions -> "APK Android (arm64)" -> Run workflow.
# =====================================================================
name: APK Android (arm64)

on:
  workflow_dispatch:
    inputs:
      regenerar:
        description: "Volver a ejecutar make gen aunque ya exista generated/"
        type: boolean
        default: false
  push:
    branches: [master, main]
    paths:
      - 'runtime/**'
      - 'tools/**'
      - 'packaging/android/**'

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 1) Descargar el codigo
        uses: actions/checkout@v4

      - name: 1b) Traer del repo original los archivos que no esten en mi fork
        run: |
          set -e
          git clone --depth 1 https://github.com/krisztsa/AllGenURecomp.git /tmp/upstream
          # solo rellena huecos: no pisa nada de lo tuyo (el parche Android manda)
          rsync -a --ignore-existing /tmp/upstream/ ./ --exclude '.git'
          echo "runtime/ archivos C: $(ls runtime/*.c 2>/dev/null | wc -l)"
          echo "third_party/cimgui/imgui: $(ls third_party/cimgui/imgui/imgui.cpp 2>/dev/null || echo FALTA)"

      - name: 2) Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3) Instalar Android SDK + NDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-34" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: 4) Cache de compilacion (acelera los siguientes intentos)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: allgenu-android

      - name: 5) SDL3 para Android
        run: |
          set -e
          mkdir -p packaging/android/libs/arm64-v8a deps/sdl3/include
          SDL_VER=3.4.18
          curl -sSL -o /tmp/sdl3.zip \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VER}/SDL3-devel-${SDL_VER}-android.zip"
          unzip -q /tmp/sdl3.zip -d /tmp/sdl3pkg
          AAR=$(find /tmp/sdl3pkg -name 'SDL3-*.aar' | head -n1)
          unzip -q "$AAR" -d /tmp/sdl3aar
          cp /tmp/sdl3aar/prefab/modules/SDL3-shared/libs/android.arm64-v8a/libSDL3.so \
             packaging/android/libs/arm64-v8a/
          cp -r /tmp/sdl3aar/prefab/modules/SDL3-Headers/include/. deps/sdl3/include/
          if [ -f /tmp/sdl3aar/classes.jar ] && [ ! -d packaging/android/src/org/libsdl ]; then
            mkdir -p packaging/android/src
            unzip -q /tmp/sdl3aar/classes.jar -d packaging/android/src || true
          fi
          echo "SDL3_INCLUDE=$PWD/deps/sdl3/include" >> "$GITHUB_ENV"
          ls -la packaging/android/libs/arm64-v8a/

      - name: 6) Dependencias Python (en un entorno conocido por el Makefile)
        run: |
          set -e
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install lz4 capstone unicorn
          ln -sf "$PWD/.venv/bin/python3" tools/python3
          tools/python3 -c "import lz4, capstone; print('python listo:', __import__('sys').version.split()[0])"

      - name: 6b) Headers minimos de FFmpeg (para compilar movie.c y los stubs)
        run: |
          set -e
          D=deps/ffmpeg-stub/include
          mkdir -p "$D/libavformat" "$D/libavcodec" "$D/libavutil"
          cat > "$D/libavutil/rational.h" <<'EOF'
          #pragma once
          #include <stdint.h>
          typedef struct AVRational { int num, den; } AVRational;
          EOF
          cat > "$D/libavutil/error.h" <<'EOF'
          #pragma once
          #define AVERROR(e) (-(e))
          #define ENOSYS 38
          EOF
          cat > "$D/libavutil/frame.h" <<'EOF'
          #pragma once
          #include <stdint.h>
          typedef struct AVFrame {
              uint8_t *data[8];
              int linesize[8];
              int width, height, format;
              int64_t pts;
          } AVFrame;
          EOF
          cat > "$D/libavcodec/codec_id.h" <<'EOF'
          #pragma once
          enum AVCodecID { AV_CODEC_ID_NONE = 0 };
          EOF
          cat > "$D/libavutil/pixfmt.h" <<'EOF'
          #pragma once
          enum AVPixelFormat { AV_PIX_FMT_NONE = -1, AV_PIX_FMT_NV12 };
          EOF
          cat > "$D/libavcodec/avcodec.h" <<'EOF'
          #pragma once
          #include <stdint.h>
          #include <libavcodec/codec_id.h>
          #include <libavutil/frame.h>
          #include <libavutil/pixfmt.h>
          #include <libavutil/rational.h>
          typedef struct AVCodec AVCodec;
          typedef struct AVCodecParameters { enum AVCodecID codec_id; } AVCodecParameters;
          typedef struct AVPacket { uint8_t *data; int size; int64_t pts, dts; } AVPacket;
          typedef struct AVCodecContext {
              const AVCodec *codec; enum AVCodecID codec_id;
              int width, height; enum AVPixelFormat pix_fmt; AVRational time_base;
          } AVCodecContext;
          const AVCodec *avcodec_find_decoder(enum AVCodecID id);
          AVCodecContext *avcodec_alloc_context3(const AVCodec *codec);
          void avcodec_free_context(AVCodecContext **avctx);
          int avcodec_parameters_to_context(AVCodecContext *codec, const AVCodecParameters *par);
          int avcodec_send_packet(AVCodecContext *avctx, const AVPacket *avpkt);
          int avcodec_receive_frame(AVCodecContext *avctx, AVFrame *frame);
          void avcodec_flush_buffers(AVCodecContext *avctx);
          AVPacket *av_packet_alloc(void);
          void av_packet_free(AVPacket **pkt);
          void av_packet_unref(AVPacket *pkt);
          AVFrame *av_frame_alloc(void);
          void av_frame_free(AVFrame **frame);
          AVFrame *av_frame_clone(const AVFrame *src);
          EOF
          cat > "$D/libavformat/avformat.h" <<'EOF'
          #pragma once
          #include <stdint.h>
          #include <libavcodec/avcodec.h>
          #include <libavutil/rational.h>
          typedef struct AVInputFormat AVInputFormat;
          typedef struct AVDictionary AVDictionary;
          typedef struct AVStream {
              int index; enum AVCodecID codecpar_id;
              AVRational time_base; int64_t duration;
          } AVStream;
          typedef struct AVFormatContext {
              AVStream **streams; unsigned int nb_streams;
              int64_t duration; const char *url;
          } AVFormatContext;
          int avformat_open_input(AVFormatContext **ps, const char *url, const AVInputFormat *fmt, AVDictionary **options);
          int avformat_find_stream_info(AVFormatContext *ic, AVDictionary **options);
          void avformat_close_input(AVFormatContext **s);
          int av_read_frame(AVFormatContext *s, AVPacket *pkt);
          int av_seek_frame(AVFormatContext *s, int stream_index, int64_t timestamp, int flags);
          EOF
          echo "FFMPEG_INCLUDE=$PWD/$D" >> "$GITHUB_ENV"
          find "$D" -name '*.h' | sort

      - name: 7) Descargar mi dump (repo privado)
        env:
          DUMP_REPO: ${{ secrets.DUMP_REPO }}
          DUMP_TOKEN: ${{ secrets.DUMP_TOKEN }}
        run: |
          set -e
          if [ -z "${DUMP_REPO:-}" ] || [ -z "${DUMP_TOKEN:-}" ]; then
            echo "::warning::No hay DUMP_REPO/DUMP_TOKEN. Se compilara sin el codigo del juego."
            exit 0
          fi
          if ! git clone --depth 1 "https://x-access-token:${DUMP_TOKEN}@github.com/${DUMP_REPO}.git" /tmp/dump; then
            echo "::error::No pude clonar ${DUMP_REPO}. Revisa: el repo existe y esta en privado, DUMP_REPO esta escrito usuario/repo, y el token tiene Contents: Read-only sobre ESE repo."
            exit 1
          fi
          ls -la /tmp/dump | head -20
          mkdir -p gamedata
          if ! python3 tools/preparar-dump.py /tmp/dump gamedata; then
            echo "::error::Tu repo privado no tiene un exefs valido. Sube exefs.zip (con la carpeta exefs/ dentro) a la raiz de ${DUMP_REPO}."
            exit 1
          fi
          echo "--- comprobando que es v1.4.0 ---"
          if ! python3 tools/verificar-dump.py gamedata/exefs/main; then
            echo "::error::Ese dump no es Monster Hunter Generations Ultimate v1.4.0. Reextrae el juego con la actualizacion 1.4.0."
            exit 1
          fi
          rm -rf /tmp/dump

      - name: 8) Traducir el juego (make gen)
        id: gen
        run: |
          set -e
          if [ ! -d gamedata/exefs ]; then
            echo "hecho=saltado" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -d generated ] && [ -n "$(ls -A generated 2>/dev/null)" ] && [ "${{ inputs.regenerar }}" != "true" ]; then
            echo "Ya existe generated/: no se regenera"
            echo "hecho=existente" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # OJO: make gen NO va en paralelo: los dos gen.py (sdk y main) escriben
          # en el mismo arbol y se pisan. Sin -j es lento pero correcto.
          if ! make gen GAME=gamedata PY=python3 2>&1 | tee /tmp/gen.log; then
            grep -iE "error|Error|not found|Traceback|No module" /tmp/gen.log | tail -20 || true
            echo "::error::Fallo la traduccion del juego. Mira arriba: casi siempre es Python (modulo que falta) o falta de memoria."
            exit 1
          fi
          du -sh generated
          echo "hecho=generado" >> "$GITHUB_OUTPUT"

      - name: 8b) Guardar generated/ para el proximo intento
        if: steps.gen.outputs.hecho == 'generado'
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated/
          compression-level: 0
          retention-days: 7

      - name: 8c) Comprobar que generated/ tiene el codigo traducido
        run: |
          set -e
          n=$(ls generated/main/*.c 2>/dev/null | wc -l)
          m=$(ls generated/sdk/*.c 2>/dev/null | wc -l)
          echo "generated/main: $n archivos .c"
          echo "generated/sdk : $m archivos .c"
          if [ "$n" -eq 0 ] || [ "$m" -eq 0 ]; then
            echo "::error::make gen no produjo los .c esperados (main=$n, sdk=$m)."
            exit 1
          fi

      - name: 9) Compilar libmain.so
        run: |
          set -e
          cmake -S runtime -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSDL3_INCLUDE_DIR="$SDL3_INCLUDE" \
            -DFFMPEG_INCLUDE_DIR="$FFMPEG_INCLUDE" \
            -DBUILD_FFMPEG_STUBS=ON
          cmake --build build-android --target main -j"$(nproc)"
          cp build-android/lib/arm64-v8a/libmain.so packaging/android/libs/arm64-v8a/
          ls -lh packaging/android/libs/arm64-v8a/

      - name: 10) Crear el APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -e
          mkdir -p packaging/android/build
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > packaging/android/build/allgenu.keystore
            echo "KEYSTORE=$PWD/packaging/android/build/allgenu.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=${KS_PASS:-allgenukey}" >> "$GITHUB_ENV"
          fi
          chmod +x packaging/android/build_apk.sh
          bash packaging/android/build_apk.sh
          ls -lh packaging/android/build/*.apk

      - name: 11) Subir el APK (aqui lo descargas)
        uses: actions/upload-artifact@v4
        with:
          name: AllGenURecomp-APK-arm64
          path: packaging/android/build/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resumen
        run: |
          {
            echo "### APK listo"
            echo ""
            echo "Descargalo en **Artifacts -> AllGenURecomp-APK-arm64**."
            echo "En el telefono: abre el zip, toca el .apk, instala."
            echo ""
            echo "Tus archivos del juego van en:"
            echo 'Android/data/com.kriszts.allgenu/files/game/{exefs,romfs}'
          } >> "$GITHUB_STEP_SUMMARY"
